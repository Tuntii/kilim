name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  IYI_VERSION: 0.21.0
  SDL_RENDER_DRIVER: software

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # sdl: on Windows the SDL backend must be asked for; elsewhere it is the only one.
          - os: windows-latest
            wrap: ""
            sdl: -Dsdl
          - os: ubuntu-24.04
            wrap: xvfb-run -a
            sdl: ""
          - os: macos-15
            wrap: ""
            sdl: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # --- iyi 0.21.0 (installer from the same tag, pinned by IYI_VERSION) ---
      - name: Install iyi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/iyilang/iyi/v$env:IYI_VERSION/install.ps1 | iex
          "$env:LOCALAPPDATA\Programs\iyi\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install iyi (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/iyilang/iyi/v$IYI_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Core modules are SDL-free; tests run without SDL installed.
      - name: Test
        run: iyi test

      # --- SDL3 + SDL3_ttf ---
      - name: MSVC dev shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # --- native Windows backend (Win32 + Direct2D + DirectWrite): needs no SDL ---
      - name: Native smoke (Windows)
        if: runner.os == 'Windows'
        run: iyi run examples/smoke_win32.iyi
      - name: Native todo self-test (Windows)
        if: runner.os == 'Windows'
        env:
          KILIM_SELFTEST: todo_win32.bmp
        run: iyi run examples/todo.iyi
      - name: Native benchmarks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "## Benchmarks: ${{ matrix.os }} (native)" > bench_win32.md
          iyi run bench/render.iyi | tee -a bench_win32.md
          cat bench_win32.md >> "$GITHUB_STEP_SUMMARY"

      - name: SDL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-sdl.ps1

      - name: Build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xvfb libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libgl-dev libegl-dev
      - name: Cache SDL (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: vendor/linux
          key: sdl-linux-${{ hashFiles('scripts/sdl-versions.txt', 'scripts/build-sdl-linux.sh') }}
      - name: SDL (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-sdl-linux.sh

      - name: SDL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl3 sdl3_ttf
          # Homebrew's lib directory is not on cc's default search path.
          echo "IYI_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # --- smoke (Window + SdlCanvas, writes smoke.bmp): default video
      # driver first; offscreen if the window cannot be opened ---
      - name: Smoke
        shell: bash
        run: |
          iyi version
          if ${{ matrix.wrap }} iyi run ${{ matrix.sdl }} examples/smoke.iyi 2>&1 | tee smoke.log; then
            echo "video driver: default${{ matrix.wrap && ' (xvfb)' || '' }}"
          elif grep -qE 'kilim: SDL_(Init|CreateWindow|CreateRenderer)' smoke.log; then
            echo "window could not be opened, retrying with SDL_VIDEO_DRIVER=offscreen"
            SDL_VIDEO_DRIVER=offscreen iyi run ${{ matrix.sdl }} examples/smoke.iyi
            echo "video driver: offscreen"
          else
            exit 1
          fi

      # --- todo acceptance example: events are injected, todo.bmp is written ---
      - name: Todo self-test
        shell: bash
        env:
          KILIM_SELFTEST: todo.bmp
        run: |
          if ${{ matrix.wrap }} iyi run ${{ matrix.sdl }} examples/todo.iyi 2>&1 | tee todo.log; then
            echo "video driver: default${{ matrix.wrap && ' (xvfb)' || '' }}"
          elif grep -qE 'kilim: SDL_(Init|CreateWindow|CreateRenderer)' todo.log; then
            echo "window could not be opened, retrying with SDL_VIDEO_DRIVER=offscreen"
            SDL_VIDEO_DRIVER=offscreen iyi run ${{ matrix.sdl }} examples/todo.iyi
            echo "video driver: offscreen"
          else
            exit 1
          fi

      # --- benchmarks: report only (hosted runners are noisy), shown in the job summary ---
      - name: Benchmarks
        shell: bash
        run: |
          echo "## Benchmarks: ${{ matrix.os }}" > bench.md
          iyi run bench/core.iyi | tee -a bench.md
          ${{ matrix.wrap }} iyi run ${{ matrix.sdl }} bench/render.iyi | tee -a bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: |
            bench.md
            bench_win32.md
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: |
            smoke.bmp
            todo.bmp
            smoke_win32.bmp
            todo_win32.bmp
          if-no-files-found: warn

  # Releases from master on demand (Run workflow) once every platform passed: semantic-release reads the
  # Conventional Commits since the last tag, picks the version (release.config.mjs),
  # tags it and publishes a GitHub release with the notes.
  release:
    name: release
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release@24 -p conventional-changelog-conventionalcommits@8 semantic-release
